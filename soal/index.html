<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MathPlay - Mode Belajar</title>
    <link rel="stylesheet" href="soal.css?v=1.1">
</head>
<body>

<div class="app-container">
    <header>
        <h2 id="judul-halaman">Pilih Mode Belajar</h2>
        <div class="quiz-header">
    <span>🏆 Skor: <span id="skor-display">0</span></span>
    <span>📌 Soal: <span id="soal-ke">1</span>
</div>

    </header>

    <!-- Sub-Menu (Tab) -->
    <nav class="sub-menu">
        <button id="btn-tab-gambar" class="tab-btn active" onclick="switchTab('mode-gambar')">🖼️ Analisis Gambar</button>
        <button id="btn-tab-teks" class="tab-btn" onclick="switchTab('mode-teks')">📝 Kuis Cepat (ABC)</button>
    </nav>

    <!-- 🖼️ Konten 1: Mode Analisis Gambar (Pake Tabel) -->
    <section id="mode-gambar" class="tab-content">
        <div class="game-analisis">
            <div class="display-soal-gambar">
                <!-- Gambar bakal muncul di sini lewat JS -->
                <img id="gambar-materi" src="" alt="Materi Soal">
                <p id="instruksi-gambar">Hitunglah data pada gambar dan isi tabel!</p>
            </div>

            <div class="tabel-jawaban-container">
                <table class="tabel-interaktif">
                    <thead>
                        <tr>
                            <th>Nama Benda</th>
                            <th>Jumlah (Pilih)</th>
                        </tr>
                    </thead>
                    <tbody id="isi-tabel-kuis">
                        <!-- Baris tabel di-generate JS -->
                    </tbody>
                </table>
                <button id="btn-cek-tabel" onclick="cekJawabanTabel()">Cek Hasil 🐊</button>
            </div>
        </div>
    </section>

    <!-- 📝 Konten 2: Soal Teks ABC -->
    <section id="mode-teks" class="tab-content hidden">
        <div id="display-kuis">
            <!-- Inject dari JS (Header Skor & Card Soal) -->
        </div>
    </section>
</div>

<!-- Script JS di paling bawah -->
<script src="soal.js?v=1.1"></script>


<div class="header-logos" style="
    position: absolute; 
    top: 15px; 
    right: 20px; 
    display: flex; 
    gap: 15px; 
    z-index: 9999;
">
    <img src="upi.png" alt="Logo UPI" style="
        height: 60px; 
        width: auto; 
        filter: drop-shadow(0 4px 6px rgba(0,0,0,0.3));
    ">
    <img src="pgsd.png" alt="Logo PGSD" style="
        height: 60px; 
        width: auto; 
        filter: drop-shadow(0 4px 6px rgba(0,0,0,0.3));
    ">
</div>

<!-- Tambahkan CSS ini di bagian <style> agar teks H1 tidak tertimpa -->
<style>
    body {
        padding-top: 80px; /* Memberi ruang agar H1 tidak tertutup logo */
    }
    
    @media (max-width: 600px) {
        .header-logos img {
            height: 45px; /* Sedikit lebih kecil jika di layar HP */
        }
    }
</style>

<!-- Tombol Kembali Absolut di Kiri -->
<a href="../" class="btn-back" style="
    position: absolute; 
    top: 15px; 
    left: 20px; 
    z-index: 9999;
    text-decoration: none;
    background: white;
    color: #00b894;
    padding: 10px 18px;
    border-radius: 12px;
    font-weight: bold;
    display: flex;
    align-items: center;
    gap: 8px;
    box-shadow: 0 4px 6px rgba(0,0,0,0.2);
    transition: 0.3s;
    border: 2px solid #eee;
">
    <span>⬅</span> Kembali
</a>

<!-- Update Style dikit biar tombolnya responsif juga -->
<style>
    .btn-back:hover {
        background: #00b894;
        color: white;
        transform: scale(1.05);
        border-color: #00b894;
    }

    @media (max-width: 600px) {
        .btn-back {
            padding: 8px 12px;
            font-size: 0.8rem;
            top: 20px; /* Sesuaikan biar sejajar sama logo kecil di HP */
        }
    }
</style>

</body>
</html>
