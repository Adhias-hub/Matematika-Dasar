<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MathPlay - Video Belajar</title>
    <link rel="stylesheet" href="soal.css?v=1.1">
    <style>
        .video-container {
            width: 100%;
            max-width: 600px;
            margin: 20px auto;
            background: white;
            padding: 15px;
            border-radius: 25px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            text-align: center;
        }

        .iframe-wrapper {
            position: relative;
            padding-bottom: 56.25%; /* Ratio 16:9 */
            height: 0;
            overflow: hidden;
            border-radius: 15px;
            background: #000;
        }

        .iframe-wrapper iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
        }

        .video-desc {
            margin-top: 20px;
            padding: 15px;
            background: #f0fff4;
            border-left: 5px solid var(--primary);
            border-radius: 10px;
            text-align: left;
        }

        .btn-mulai-kuis {
            display: inline-block;
            margin-top: 20px;
            padding: 15px 30px;
            background: var(--secondary);
            color: white;
            text-decoration: none;
            border-radius: 15px;
            font-weight: bold;
            transition: 0.3s;
        }

        .btn-mulai-kuis:hover {
            transform: translateY(-3px);
            box-shadow: 0 5px 15px rgba(108, 92, 231, 0.4);
        }

      .btn-back {
    position: absolute;
    left: 20px;
    top: 20px;
    text-decoration: none;
    
    /* Warna teks: Gelap biar kelihatan di putih, tapi bakal nyala pas hover */
    color: #1e293b; 
    font-weight: bold;
    font-size: 0.9rem;
    
    /* Efek Kaca Putih Solid sedikit transparan */
    background: rgba(255, 255, 255, 0.8); 
    padding: 10px 20px;
    border-radius: 15px;
    backdrop-filter: blur(10px);
    
    /* Border Neon Tipis */
    border: 2px solid #0ea5e9;
    
    /* Efek Glow (Nyala) */
    box-shadow: 0 0 15px rgba(14, 165, 233, 0.4);
    
    transition: 0.3s;
    z-index: 100;
    display: flex;
    align-items: center;
    justify-content: center;
}

.btn-back:hover {
    background: #0ea5e9; /* Jadi biru penuh saat hover */
    color: white; /* Teks jadi putih pas hover */
    transform: scale(1.1);
    box-shadow: 0 0 25px #0ea5e9; /* Glow makin kuat pas disentuh */
}

    </style>
</head>
<body>

<div class="app-container">
    <header>
        <h2 id="judul-halaman">Video Pembelajaran</h2>
    </header>

    <div class="video-container">
        <h3 style="color: var(--text-dark); margin-bottom: 15px;">📺 Belajar Pengolahan Data (MTK SD)</h3>
        
        <div class="iframe-wrapper">
           fkLoddIt60Y
      <iframe src="https://www.youtube.com/embed/fkLoddIt60Y" 
            title="Video Pembelajaran Matematika SD" 
            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
            allowfullscreen>
      </iframe>
</div>

        <div class="video-desc">
            <p><strong>Apa yang akan dipelajari?</strong></p>
            <ul style="font-size: 0.9rem; color: #636e72;">
                <li>Cara membaca data dari tabel</li>
                <li>Mengenal diagram gambar (Turus)</li>
                <li>Menghitung selisih dan jumlah data</li>
            </ul>
        </div>

        <a href="../soal/" class="btn-mulai-kuis">Siap Latihan Soal? 🔥</a>
    </div>
</div>

<div class="header-logos" style="
    position: absolute; 
    top: 15px; 
    right: 20px; 
    display: flex; 
    gap: 15px; 
    z-index: 9999;
">
    <img src="upi.png" alt="Logo UPI" style="
        height: 60px; 
        width: auto; 
        filter: drop-shadow(0 4px 6px rgba(0,0,0,0.3));
    ">
    <img src="pgsd.png" alt="Logo PGSD" style="
        height: 60px; 
        width: auto; 
        filter: drop-shadow(0 4px 6px rgba(0,0,0,0.3));
    ">
</div>

<!-- Tambahkan CSS ini di bagian <style> agar teks H1 tidak tertimpa -->
<style>
    body {
        padding-top: 80px; /* Memberi ruang agar H1 tidak tertutup logo */
    }
    
    @media (max-width: 600px) {
        .header-logos img {
            height: 45px; /* Sedikit lebih kecil jika di layar HP */
        }
    }
</style>

<!-- Tombol Kembali Absolut di Kiri -->
<a href="../" class="btn-back" style="
    position: absolute; 
    top: 15px; 
    left: 20px; 
    z-index: 9999;
    text-decoration: none;
    background: white;
    color: #00b894;
    padding: 10px 18px;
    border-radius: 12px;
    font-weight: bold;
    display: flex;
    align-items: center;
    gap: 8px;
    box-shadow: 0 4px 6px rgba(0,0,0,0.2);
    transition: 0.3s;
    border: 2px solid #eee;
">
    <span>⬅</span> Kembali
</a>

<!-- Update Style dikit biar tombolnya responsif juga -->
<style>
    .btn-back:hover {
        background: #00b894;
        color: white;
        transform: scale(1.05);
        border-color: #00b894;
    }

    @media (max-width: 600px) {
        .btn-back {
            padding: 8px 12px;
            font-size: 0.8rem;
            top: 20px; /* Sesuaikan biar sejajar sama logo kecil di HP */
        }
    }
</style>

</body>
</html>
