<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Peta Petualangan Matematika</title>
    <link rel="stylesheet" href="game.css">
</head>
<body>
    <div id="map-world">
        <div class="map-header">
            <h1>DUNIA MATEMATIKA 🗺️</h1>
            <p>Klik pos untuk mulai bermain!</p>
        </div>

        <div class="map-stage">
            <!-- Game 1 -->
            <div class="pos-item" onclick="go('../game1/', this)">
                <div class="icon">🔢</div>
                <div class="label">HITUNG</div>
            </div>

            <!-- Game 2 -->
            <div class="pos-item" onclick="go('../game2/', this)">
                <div class="icon">🍎</div>
                <div class="label">SORTIR</div>
            </div>

            <!-- Game 3 -->
           <div class="pos-item" onclick="go('../game3/', this)">
                <div class="icon">🌧️</div>
                <div class="label">TURUS</div>
            </div>

            <!-- Karakter Player -->
            <div id="player">🚶‍♂️</div>
        </div>
    </div>
    <script src="game.js"></script>


<div class="header-logos" style="
    position: absolute; 
    top: 15px; 
    right: 20px; 
    display: flex; 
    gap: 15px; 
    z-index: 9999;
">
    <img src="upi.png" alt="Logo UPI" style="
        height: 60px; 
        width: auto; 
        filter: drop-shadow(0 4px 6px rgba(0,0,0,0.3));
    ">
    <img src="pgsd.png" alt="Logo PGSD" style="
        height: 60px; 
        width: auto; 
        filter: drop-shadow(0 4px 6px rgba(0,0,0,0.3));
    ">
</div>

<!-- Tambahkan CSS ini di bagian <style> agar teks H1 tidak tertimpa -->
<style>
    body {
        padding-top: 80px; /* Memberi ruang agar H1 tidak tertutup logo */
    }
    
    @media (max-width: 600px) {
        .header-logos img {
            height: 45px; /* Sedikit lebih kecil jika di layar HP */
        }
    }
</style>

<!-- Tombol Kembali Absolut di Kiri -->
<a href="../" class="btn-back" style="
    position: absolute; 
    top: 15px; 
    left: 20px; 
    z-index: 9999;
    text-decoration: none;
    background: white;
    color: #00b894;
    padding: 10px 18px;
    border-radius: 12px;
    font-weight: bold;
    display: flex;
    align-items: center;
    gap: 8px;
    box-shadow: 0 4px 6px rgba(0,0,0,0.2);
    transition: 0.3s;
    border: 2px solid #eee;
">
    <span>⬅</span> Kembali
</a>

<!-- Update Style dikit biar tombolnya responsif juga -->
<style>
    .btn-back:hover {
        background: #00b894;
        color: white;
        transform: scale(1.05);
        border-color: #00b894;
    }

    @media (max-width: 600px) {
        .btn-back {
            padding: 8px 12px;
            font-size: 0.8rem;
            top: 20px; /* Sesuaikan biar sejajar sama logo kecil di HP */
        }
    }
</style>

</body>
</html>
