<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Petualangan Matematika</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="main-container">
        <header class="hero">
            <h1>📐 PETUALANGAN<br><span>BANGUN DATAR, TABEL, TURUS</span></h1>
            <p>Halo Anak-anak! Pilih menu untuk mulai belajar dan bermain!</p>
        </header>

        <div class="menu-grid">
            <!-- Tombol Materi -->
           <a href="materi/" class="menu-card materi">
                <div class="icon">📖</div>
                <h3>Materi</h3>
                <p>Belajar</p>
            </a>

            <!-- Tombol Video -->
            <a href="video/" class="menu-card video">
                <div class="icon">🎬</div>
                <h3>Video</h3>
                <p>Tonton penjelasan seru</p>
            </a>

            <!-- Tombol Game -->
            <a href="game/"class="menu-card game">
                <div class="icon">🎮</div>
                <h3>Main Game</h3>
                <p>Sortir benda & cetak skor!</p>
            </a>

            <!-- Tombol Soal -->
            <a href="soal/" class="menu-card soal">
                <div class="icon">📝</div>
                <h3>Latihan Soal</h3>
                <p>Uji kemampuanmu di sini</p>
            </a>
        </div>

        <footer>
            <p>© 2026 - Semangat Belajar Matematika!</p>
        </footer>
    </div>


<div class="header-logos" style="
    position: absolute; 
    top: 15px; 
    right: 20px; 
    display: flex; 
    gap: 15px; 
    z-index: 9999;
">
    <img src="upi.png" alt="Logo UPI" style="
        height: 60px; 
        width: auto; 
        filter: drop-shadow(0 4px 6px rgba(0,0,0,0.3));
    ">
    <img src="pgsd.png" alt="Logo PGSD" style="
        height: 60px; 
        width: auto; 
        filter: drop-shadow(0 4px 6px rgba(0,0,0,0.3));
    ">
</div>

<!-- Tambahkan CSS ini di bagian <style> agar teks H1 tidak tertimpa -->
<style>
    body {
        padding-top: 80px; /* Memberi ruang agar H1 tidak tertutup logo */
    }
    
    @media (max-width: 600px) {
        .header-logos img {
            height: 45px; /* Sedikit lebih kecil jika di layar HP */
        }
    }
</style>
</body>
</html>
